<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Our Favorite Music Catalog</title>

    <link rel="stylesheet" href="css/style.css">

</head>

    <!-- Included scripts to edit -->
    <script src="js/html-event-handlers.js"></script>
